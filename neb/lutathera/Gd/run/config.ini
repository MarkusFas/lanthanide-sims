# eOn: NEB with climbing image and dimer (MMF) refinement, metatomic potential

[Main]
job = nudged_elastic_band
random_seed = 706253457

[Potential]
potential = Metatomic

[Metatomic]
model_path = /ABS/PATH/TO/pet-mad-xs-v1.5.0.pt
device = cuda
deterministic = true
non_conservative = false

[Nudged Elastic Band]
images = 12
# idpp | linear | idpp_collective | sidpp | file
initializer = idpp
# Relax reactant/product with the same model before building the band
minimize_endpoints = true

# Springs (eV/A^2). With energy_weighted = true the spring constant varies
# between ew_ksp_min and ew_ksp_max, stiffer near the climbing image.
spring = 5.0
energy_weighted = true
ew_ksp_min = 0.972
ew_ksp_max = 9.72

# Climbing image
climbing_image_method = true

# Dimer refinement at the climbing image (OCINEB / MMF)
ci_mmf = true
# Defaults shown explicitly
ci_mmf_after = 0.5
ci_mmf_nsteps = 10
ci_mmf_ci_stability_count = 5
ci_mmf_angle = 0.8
setup_mmf_peaks = true
mmf_peak_tolerance = 0.05

neb_max_iterations = 1000
converged_force = 0.01

[Optimizer]
opt_method = lbfgs
max_iterations = 1000
max_move = 0.1
converged_force = 0.01

[Dimer]
# Used by the MMF step at the climbing image (all defaults)
opt_method = cg
rotations_max = 10
converged_angle = 5.0

[Debug]
# Per-iteration neb_NNN.dat / neb_path_NNN.con for plotting band evolution
write_movies = true
